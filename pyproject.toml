[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-lsc-td3"
version = "0.1.0"
description = "Control-authority-aware liquid safety-constrained TD3 for Lift+Cruise VTOL transition"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.26.4",
    "torch==2.13.0",
    "gymnasium==1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ca_lsc_td3 = ["_vendor/CFC_LICENSE", "_vendor/CFC_NOTICE"]
